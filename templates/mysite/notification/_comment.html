<div class="col-md-1 col-2">
    <img src="{{ notification.sender.profile.image.url }}" class="article_profile_image rounded-circle border border-secondary">
</div>
<div class="col-lg-8 col-6">
    <p class="fw-light">
        {{ notification.sender.profile.username|truncatechars:20 }}さんが{{ notification.comment.article.title|truncatechars:20 }}にコメントしました。
    </p>
    <small class="fw-lighter">
        {{ notification.created_at }}
    </small>
</div>
<div class="col-lg-2 col-4">
    <img src="{{ notification.comment.article.image.all.0.image.url }}" class="img-thumbnail notification_article_image">
</div>
