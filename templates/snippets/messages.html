{% for message in messages %}
<div class="container z-3 position-absolute">
    <div class="row">
        <div class="col-lg-6 col-md-8 col-12 m-auto py-2 {{ message.tags }}" id="message">
            <div class=" text-center p-1">
                {{ message }}
            </div>
        </div>
    </div>
</div>
{% endfor %}

<script>
    // 10秒後にメッセージを非表示にする関数
    setTimeout(function() {
        try {
            document.getElementById('message').style.display = 'none';
        } catch (e) {}
    }, 1000); // 10000ミリ秒 = 10秒
</script>
